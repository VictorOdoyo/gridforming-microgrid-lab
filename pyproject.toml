[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridforming-microgrid-lab"
version = "0.1.0"
description = "Reproducible grid-forming microgrid dynamics and engineering benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Victor Odoyo"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1"]
[project.scripts]
gridlab = "gridlab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py311"
